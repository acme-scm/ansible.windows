---
- name: Make sure we start the tests with the defaults
  win_inet_proxy:
- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml
  always:
    - name: Reset proxy back to defaults
      win_inet_proxy:

    - name: Remove phonebook entry
      win_phonebook_entry:
        name: Ansible Test Dialup
        state: absent
