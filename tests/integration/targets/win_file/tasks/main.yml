- name: Create a directory
  win_file: path={{ remote_tmp_dir }}/dirtest state=directory
  register: file_result

- name: Stat the directory created
  win_stat: path={{ remote_tmp_dir }}/dirtest
  register: stat_result

- name: Assert the directory was created
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists
      - stat_result.stat.isdir

- name: Re run create directory (bug 2147)
  win_file: path={{ remote_tmp_dir }}/dirtest state=directory
  register: file_result

- name: Stat the directory created again
  win_stat: path={{ remote_tmp_dir }}/dirtest
  register: stat_result

- name: Assert the directory exists but was not changed
  ansible.builtin.assert:
    that:
      - file_result.changed == False
      - stat_result.stat.exists
      - stat_result.stat.isdir

- name: Remove empty dir we just created
  win_file: path={{ remote_tmp_dir }}/dirtest state=absent
  register: file_result

- name: Stat the removed directory
  win_stat: path={{ remote_tmp_dir }}/dirtest
  register: stat_result

- name: Assert the directory does not exist
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists == False

- name: Create dir with spaces and parens in the dir name
  win_file:
    path: "{{ remote_tmp_dir }}\\dir with spaces (and parens) [block]"
    state: directory
  register: file_result

- name: Stat the directory with spaces and parens
  win_stat:
    path: "{{ remote_tmp_dir }}\\dir with spaces (and parens) [block]"
  register: stat_result

- name: Check dir with spaces and parens in the dir name has been created
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists
      - stat_result.stat.isdir

- name: Create file in dir with special char
  win_file:
    path: "{{ remote_tmp_dir }}\\dir with spaces (and parens) [block]\\file[1].txt"
    state: touch
  register: file_result

- name: Stat the file with spaces and parens
  win_stat:
    path: "{{ remote_tmp_dir }}\\dir with spaces (and parens) [block]\\file[1].txt"
  register: stat_result

- name: Check file in dir with spaces and parens exist
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists
      - stat_result.stat.isreg

- name: Remove dir with spaces and parens in the dir name
  win_file:
    path: "{{ remote_tmp_dir }}/dir with spaces (and parens) [block]"
    state: absent
  register: file_result

- name: Stat the dir with spaces and parens in the dir name
  win_stat:
    path: "{{ remote_tmp_dir }}\\dir with spaces (and parens) [block]"
  register: stat_result

- name: Assert dir with spaces and parens in the dir name was removed
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists == False
# Need to use shell to create the file as win_file doesn't support setting attributes

- name: Create hidden file
  win_shell: $file = New-Item -Path "{{ remote_tmp_dir }}\hidden.txt" -ItemType File; $file.Attributes = "Hidden"

- name: Delete hidden file
  win_file:
    path: "{{ remote_tmp_dir }}\\hidden.txt"
    state: absent
  register: delete_hidden

- name: Get result of delete hidden file
  win_stat:
    path: "{{ remote_tmp_dir }}\\hidden.txt"
  register: delete_hidden_actual

- name: Assert delete hidden file
  ansible.builtin.assert:
    that:
      - delete_hidden is changed
      - not delete_hidden_actual.stat.exists

- name: Create folder to point set symbolic link for
  win_file:
    path: "{{ remote_tmp_dir }}/link-test/link-target"
    state: directory

- name: Create symbolic link
  win_command: cmd.exe /c mklink /d "{{ remote_tmp_dir }}\link-test\link" "{{ remote_tmp_dir }}\link-test\link-target"

- name: Remove symbolic link target
  win_file:
    path: "{{ remote_tmp_dir }}/link-test/link-target"
    state: absent

- name: Remove parent folder with broken link
  win_file:
    path: "{{ remote_tmp_dir }}/link-test"
    state: absent

- name: Clean up sub1
  win_file: path={{ remote_tmp_dir }}/sub1 state=absent

- name: Clean up sub2
  win_file: path={{ remote_tmp_dir }}/sub2 state=absent

- name: Create file and set modification and access times
  win_file:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
    state: touch
    modification_time: "2025-12-30 12:00:00"
    access_time: "2025-12-29 13:00:00"
  register: file_result

- name: Verify file exists
  win_stat:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
  register: stat_result

- name: Get file timestamp
  win_shell: >-
    $file = Get-Item "{{ remote_tmp_dir }}\test_file.txt";
    @{
      mTime = $file.LastWriteTime.ToString("yyyy-MM-dd HH:mm:ss")
      aTime = $file.LastAccessTime.ToString("yyyy-MM-dd HH:mm:ss")
    } | ConvertTo-Json
  register: file_timestamp

- name: Check file exists and their modification and access times
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists
      - (file_timestamp.stdout | from_json).mTime == "2025-12-30 12:00:00"
      - (file_timestamp.stdout | from_json).aTime == "2025-12-29 13:00:00"

- name: Clean up test file
  win_file:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
    state: absent

- name: Create directory and set modification and access times
  win_file:
    path: "{{ remote_tmp_dir }}\\test_directory"
    state: directory
    modification_time: "2025-12-30 12:00:00"
    access_time: "2025-12-29 13:00:00"
  register: file_result

- name: Verify directory exists
  win_stat:
    path: "{{ remote_tmp_dir }}\\test_directory"
  register: stat_result

- name: Get directory timestamp
  win_shell: >-
    $file = Get-Item "{{ remote_tmp_dir }}\test_directory";
    @{
      mTime = $file.LastWriteTime.ToString("yyyy-MM-dd HH:mm:ss")
      aTime = $file.LastAccessTime.ToString("yyyy-MM-dd HH:mm:ss")
    } | ConvertTo-Json
  register: file_timestamp

- name: Check directory exists and their modification and access times
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists
      - (file_timestamp.stdout | from_json).mTime == "2025-12-30 12:00:00"
      - (file_timestamp.stdout | from_json).aTime == "2025-12-29 13:00:00"

- name: Clean up test directory
  win_file:
    path: "{{ remote_tmp_dir }}\\test_directory"
    state: absent

- name: Touch a file with known timestamp
  win_file:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
    state: touch
    modification_time: "2025-12-30 12:00:00"
    access_time: "2025-12-29 13:00:00"
  register: file_result

- name: Verify file exists
  win_stat:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
  register: stat_result

- name: Check file exists
  ansible.builtin.assert:
    that:
      - file_result.changed
      - stat_result.stat.exists

- name: Get file timestamp before preserve
  win_shell: >-
    $file = Get-Item "{{ remote_tmp_dir }}\test_file.txt";
    @{
      mTime = $file.LastWriteTime.ToString("yyyy-MM-dd HH:mm:ss")
      aTime = $file.LastAccessTime.ToString("yyyy-MM-dd HH:mm:ss")
    } | ConvertTo-Json
  register: file_timestamp_before

- name: Touch the file again (preserve mode)
  win_file:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
    state: touch
    modification_time: preserve
    access_time: preserve
  register: file_result

- name: Verify file exists (preserve mode)
  win_stat:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
  register: stat_result

- name: Check file exists (preserve mode)
  ansible.builtin.assert:
    that:
      - file_result.changed == False
      - stat_result.stat.exists

- name: Get file timestamp after preserve (preserve mode)
  win_shell: >-
    $file = Get-Item "{{ remote_tmp_dir }}\test_file.txt";
    @{
      mTime = $file.LastWriteTime.ToString("yyyy-MM-dd HH:mm:ss")
      aTime = $file.LastAccessTime.ToString("yyyy-MM-dd HH:mm:ss")
    } | ConvertTo-Json
  register: file_timestamp_after

- name: Check file timestamps are preserved
  ansible.builtin.assert:
    that:
      - (file_timestamp_before.stdout | from_json).mTime == (file_timestamp_after.stdout | from_json).mTime
      - (file_timestamp_before.stdout | from_json).aTime == (file_timestamp_after.stdout | from_json).aTime

- name: Clean up test file
  win_file:
    path: "{{ remote_tmp_dir }}\\test_file.txt"
    state: absent
