---
- name: Create test group that has a network logon denied
  win_group:
    name: win_user-test
    state: present

- name: Add test group to SeDenyNetworkLogonRight
  win_user_right:
    name: SeDenyNetworkLogonRight
    users:
      - win_user-test
    action: add
- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml
  always:
    - name: Remove SeDenyNetworkLogonRight on test group
      win_user_right:
        name: SeDenyNetworkLogonRight
        users:
          - win_user-test
        action: remove

    - name: Remove test group
      win_group:
        name: win_user-test
        state: absent

    - name: Remove the test user
      win_user:
        name: "{{ test_win_user_name }}"
        state: absent
