- name: Start with feature absent
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: absent

- name: Install feature in check mode
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: present
    include_sub_features: true
    include_management_tools: true
  register: win_feature_install_result_check
  check_mode: true

- name: Check result of installing feature in check mode
  ansible.builtin.assert:
    that:
      - win_feature_install_result_check is changed
      - win_feature_install_result_check.success
      - win_feature_install_result_check.exitcode == 'Success'
      - not win_feature_install_result_check.reboot_required
      - win_feature_install_result_check.feature_result|length == 1

- name: Install feature
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: present
    include_sub_features: true
    include_management_tools: true
  register: win_feature_install_result

- name: Check result of installing feature
  ansible.builtin.assert:
    that:
      - win_feature_install_result is changed
      - win_feature_install_result.success
      - win_feature_install_result.exitcode == 'Success'
      - not win_feature_install_result.reboot_required
      - win_feature_install_result.feature_result|length == 1
      - win_feature_install_result.feature_result[0].id is defined
      - win_feature_install_result.feature_result[0].display_name is defined
      - win_feature_install_result.feature_result[0].message is defined
      - win_feature_install_result.feature_result[0].reboot_required is defined
      - win_feature_install_result.feature_result[0].skip_reason is defined
      - win_feature_install_result.feature_result[0].success is defined

- name: Install feature again
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: present
    include_sub_features: true
    include_management_tools: true
  register: win_feature_install_again_result

- name: Check result of installing feature again
  ansible.builtin.assert:
    that:
      - win_feature_install_again_result is not changed
      - win_feature_install_again_result.success
      - win_feature_install_again_result.exitcode == 'NoChangeNeeded'
      - not win_feature_install_again_result.reboot_required
      - win_feature_install_again_result.feature_result == []

- name: Remove feature in check mode
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: absent
  register: win_feature_remove_result_check
  check_mode: true

- name: Check result of removing feature in check mode
  ansible.builtin.assert:
    that:
      - win_feature_remove_result_check is changed
      - win_feature_remove_result_check.success
      - win_feature_remove_result_check.exitcode == 'Success'
      - not win_feature_remove_result_check.reboot_required
      - win_feature_remove_result_check.feature_result|length == 1

- name: Remove feature
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: absent
  register: win_feature_remove_result

- name: Check result of removing feature
  ansible.builtin.assert:
    that:
      - win_feature_remove_result is changed
      - win_feature_remove_result.success
      - win_feature_remove_result.exitcode == 'Success'
      - not win_feature_remove_result.reboot_required
      - win_feature_remove_result.feature_result|length == 1
      - win_feature_remove_result.feature_result[0].id is defined
      - win_feature_remove_result.feature_result[0].display_name is defined
      - win_feature_remove_result.feature_result[0].message is defined
      - win_feature_remove_result.feature_result[0].reboot_required is defined
      - win_feature_remove_result.feature_result[0].skip_reason is defined
      - win_feature_remove_result.feature_result[0].success is defined

- name: Remove feature again
  win_feature:
    name: "{{ test_win_feature_name }}"
    state: absent
  register: win_feature_remove_again_result

- name: Check result of removing feature again
  ansible.builtin.assert:
    that:
      - win_feature_remove_again_result is not changed
      - win_feature_remove_again_result.success
      - win_feature_remove_again_result.exitcode == 'NoChangeNeeded'
      - not win_feature_remove_again_result.reboot_required
      - win_feature_remove_again_result.feature_result == []

- name: Install multiple features
  win_feature:
    name:
      - "{{ test_win_feature_name }}"
      - "{{ test_win_feature_name2 }}"
    state: present
  register: win_feature_install_multiple_result

- name: Assert install multiple features
  ansible.builtin.assert:
    that:
      - win_feature_install_multiple_result is changed
      - win_feature_install_multiple_result.success
      - win_feature_install_multiple_result.exitcode == 'Success'
      - not win_feature_install_multiple_result.reboot_required
      - win_feature_install_multiple_result.feature_result|length == 2
      - win_feature_install_multiple_result.feature_result[0].id is defined
      - win_feature_install_multiple_result.feature_result[1].id is defined

- name: Install multiple features again
  win_feature:
    name:
      - "{{ test_win_feature_name }}"
      - "{{ test_win_feature_name2 }}"
    state: present
  register: win_feature_install_multiple_again_result

- name: Assert install multiple features again
  ansible.builtin.assert:
    that:
      - win_feature_install_multiple_again_result is not changed
      - win_feature_install_multiple_again_result.success
      - win_feature_install_multiple_again_result.exitcode == 'NoChangeNeeded'
      - not win_feature_install_multiple_again_result.reboot_required
      - win_feature_install_multiple_again_result.feature_result == []

- name: Remove multiple features
  win_feature:
    name:
      - "{{ test_win_feature_name }}"
      - "{{ test_win_feature_name2 }}"
    state: absent
  register: win_feature_remove_multiple_result

- name: Assert remove multiple features
  ansible.builtin.assert:
    that:
      - win_feature_remove_multiple_result is changed
      - win_feature_remove_multiple_result.success
      - win_feature_remove_multiple_result.exitcode == 'Success'
      - not win_feature_remove_multiple_result.reboot_required
      - win_feature_remove_multiple_result.feature_result|length == 2
      - win_feature_remove_multiple_result.feature_result[0].id is defined
      - win_feature_remove_multiple_result.feature_result[1].id is defined

- name: Remove multiple features again
  win_feature:
    name:
      - "{{ test_win_feature_name }}"
      - "{{ test_win_feature_name2 }}"
    state: absent
  register: win_feature_remove_multiple_again_result

- name: Assert remove multiple features again
  ansible.builtin.assert:
    that:
      - win_feature_remove_multiple_again_result is not changed
      - win_feature_remove_multiple_again_result.success
      - win_feature_remove_multiple_again_result.exitcode == 'NoChangeNeeded'
      - not win_feature_remove_multiple_again_result.reboot_required
      - win_feature_remove_multiple_again_result.feature_result == []

- name: Try to install an invalid feature name
  win_feature:
    name: Microsoft-Bob
    state: present
  register: win_feature_install_invalid_result
  ignore_errors: true

- name: Check result of installing invalid feature name
  ansible.builtin.assert:
    that:
      - win_feature_install_invalid_result is failed
      - win_feature_install_invalid_result is not changed
      - "'The name was not found' in win_feature_install_invalid_result.msg"

- name: Try to remove an invalid feature name
  win_feature:
    name: Microsoft-Bob
    state: absent
  register: win_feature_remove_invalid_result
  ignore_errors: true

- name: Check result of removing invalid feature name
  ansible.builtin.assert:
    that:
      - win_feature_remove_invalid_result is failed
      - win_feature_remove_invalid_result is not changed
      - "'The name was not found' in win_feature_remove_invalid_result.msg"
