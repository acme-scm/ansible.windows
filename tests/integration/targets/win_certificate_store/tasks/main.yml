### keys in files/ have been generated with
# generate root private key
# openssl genrsa -aes256 -out enckey.pem 2048
# openssl rsa -in envkey.pem -out root-key.pem
#
# generate root certificate
# openssl req -x509 -key root-key.pem -days 24855 -out root-vert.pem -subj "/CN=root.ansible.com/C=US"
#
# generate subject private key
# openssl genrsa -aes256 -out enckey.pem 2048
# openssl rsa -in enckey.pem -out subj-key.pem
#
# generate subject certificate
# openssl req -new -key subj-key.pem -out cert.csr -subj "/CN=subject.ansible.com/C=US"
# openssl x509 -req -in cert.csr -CA root-cert.pem -CAkey root-key.pem -CAcreateserial -out subj-cert.pem -days 24855
###
---
- name: Ensure test dir is present
  win_file:
    path: "{{ win_cert_dir }}\\exported"
    state: directory
- name: Ensure certificates are removed from store before test
  win_certificate_store:
    thumbprint: "{{ item }}"
    state: absent
  loop:
    - "{{ subj_thumbprint }}"
    - "{{ root_thumbprint }}"
- name: Ensure certificates are removed from custom store before test
  win_certificate_store:
    thumbprint: "{{ item }}"
    state: absent
    store_name: TrustedPeople
    store_location: CurrentUser
  loop:
    - "{{ subj_thumbprint }}"
    - "{{ root_thumbprint }}"
# these files are created on the fly so we don't store binary in the git repo
- name: Check if we can use default AES encryption
  win_powershell:
    script: |
      $osVersion = [Version](Get-Item -LiteralPath "$env:SystemRoot\System32\kernel32.dll").VersionInfo.ProductVersion
      $osVersion -ge [Version]"10.0.17763"
  changed_when: false
  register: aes256_support
- name: Create PKCS12 without password
  ansible.builtin.command:
    cmd: "openssl pkcs12 -export -out subj-cert-without-pass.pfx -inkey subj-key.pem -in subj-cert.pem -passout pass: {{ '' if aes256_support.output[0] else '-certpbe
      PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1' }}"
  changed_when: false
  delegate_to: localhost
  run_once: true
  args:
    chdir: "{{ role_path }}/files"
- name: Create PKCS12 with password
  ansible.builtin.command:
    cmd: openssl pkcs12 -export -out subj-cert-with-pass.pfx -inkey subj-key.pem -in subj-cert.pem -passout pass:{{ key_password }} {{ '' if 
      aes256_support.output[0] else '-certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1' }}
  changed_when: false
  delegate_to: localhost
  run_once: true
  args:
    chdir: "{{ role_path }}/files"
- name: Create DER encoded cert
  ansible.builtin.command:
    cmd: openssl x509 -outform der -in subj-cert.pem -out subj-cert.cer
  changed_when: false
  delegate_to: localhost
  run_once: true
  args:
    chdir: "{{ role_path }}/files"
- name: Create PEM encoded PKCS7 file
  ansible.builtin.command:
    cmd: openssl crl2pkcs7 -nocrl -certfile subj-cert.pem -certfile root-cert.pem -out chain.pem
  changed_when: false
  delegate_to: localhost
  run_once: true
  args:
    chdir: "{{ role_path }}/files"
- name: Create DER encoded PKCS7 file
  ansible.builtin.command:
    cmd: openssl crl2pkcs7 -nocrl -certfile subj-cert.pem -certfile root-cert.pem -out chain.p7b -outform der
  changed_when: false
  delegate_to: localhost
  run_once: true
  args:
    chdir: "{{ role_path }}/files"
- name: Copy across test cert files
  win_copy:
    src: files/
    dest: "{{ win_cert_dir }}"
- block:
    - name: Run tests
      ansible.builtin.include_tasks: test.yml
  always:
    - name: Ensure generated keys are deleted
      ansible.builtin.file:
        path: "{{ role_path }}/files/{{ item }}"
        state: absent
        mode: "0644"
      loop:
        - subj-cert-with-pass.pfx
        - subj-cert-without-pass.pfx
        - subj-cert.cer
        - chain.pem
        - chain.p7b
      delegate_to: localhost
      run_once: true

    - name: Ensure certificates are removed from store after test
      win_certificate_store:
        thumbprint: "{{ item }}"
        state: absent
      when: item | length > 0
      loop:
        - "{{ subj_thumbprint }}"
        - "{{ root_thumbprint }}"
        - '{{ certificat_using_cng_nonexportable.stdout_lines[0] | default("") }}'
        - '{{ certificat_using_cng_exportable.stdout_lines[0] | default("") }}'
        - '{{ certificat_using_capi_nonexportable.stdout_lines[0] | default("") }}'
        - '{{ certificat_using_capi_exportable.stdout_lines[0] | default("") }}'

    - name: Ensure certificates are removed from custom store after test
      win_certificate_store:
        thumbprint: "{{ item }}"
        state: absent
        store_name: TrustedPeople
        store_location: CurrentUser
      loop:
        - "{{ subj_thumbprint }}"
        - "{{ root_thumbprint }}"
